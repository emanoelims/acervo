version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Wait for new releases to age before proposing them. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # One PR for compatible updates; major updates stay separate for review.
    groups:
      mix:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait for new releases to age before proposing them. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    # Actions are pinned to commit SHAs and validated by CI, so one PR covers
    # every workflow file, including major updates.
    groups:
      github-actions:
        patterns: ['*']
