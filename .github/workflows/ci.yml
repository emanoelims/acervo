name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: elixir .github/scripts/check_pr_title.exs
      - name: Validate project version and release tag
        run: elixir .github/scripts/check_version.exs

  elixir:
    name: Elixir checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Resolve BEAM cache version
        id: beam
        run: elixir -e 'IO.puts("version=#{System.version()}-#{:erlang.system_info(:version)}")' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ steps.beam.outputs.version }}-test-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-${{ steps.beam.outputs.version }}-test-
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - run: mix assets.setup
      - run: mix assets.build
      - run: mix test --warnings-as-errors
