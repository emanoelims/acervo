name: Dependency submission

# GitHub's dependency graph does not read mix.lock. Submitting the resolved Mix
# dependencies lets Dependabot alerts and security updates cover Hex packages.
on:
  push:
    branches: [main]
    paths:
      - mix.exs
      - mix.lock
      - mise.toml
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit Mix dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The Dependency Submission API requires write access to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provides mix for `install-deps`, so transitive dependencies resolve fully.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: erlef/mix-dependency-submission@c5bd30a0e18822272a914adb7fb153866d491baf # v1.3.5
        with:
          install-deps: 'true'
