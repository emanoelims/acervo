name: Deploy release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Fly
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://acervo-app.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a released commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.116'
      - name: Deploy the published release
        run: flyctl deploy --remote-only --ha=false --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify production readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://acervo-app.fly.dev/health
