[tools]
elixir = "1.20.4-otp-29"
erlang = "29"

# Envs compartilhadas (versionadas). Segredos e overrides locais vão em
# `mise.local.toml` (gitignored) — veja `mise.local.toml.example`.
[env]
PORT = "4200"

[tasks.setup]
description = "Set up dependencies, database, and assets"
run = ["mix local.hex --force", "mix local.rebar --force", "mix setup"]

[tasks.dev]
description = "Start the Phoenix server"
run = "mix phx.server"

[tasks.precommit]
description = "Check compilation, unused dependencies, formatting, and tests"
run = "mix precommit"
